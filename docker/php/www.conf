[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
user = fork_panel_xc
group = fork_panel_xc
listen = 0.0.0.0:9000
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500
request_terminate_timeout = 300
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[error_log] = /home/fork_panel_xc/storage/logs/php-fpm-error.log
php_admin_flag[log_errors] = on
php_value[session.save_handler] = redis
php_value[session.save_path] = "tcp://redis:6379?auth=changeme"
